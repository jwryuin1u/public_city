<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재고배분 실행·검증 목업</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --line:#dedbd2; --ink:#1d2424; --sub:#5d6767; --faint:#8a9292;
  --accent:#0f5c5c; --accent-soft:#e3efee; --ok:#1c7a4a; --ok-soft:#e4f3ea; --warn:#9a6200; --warn-soft:#fbf0d9;
  --bad:#b3261e; --bad-soft:#fbe6e4; --info:#2b5a8c; --info-soft:#e6eef7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","NanumGothic",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
.tag{font-size:12px;padding:2px 8px;border-radius:3px;background:var(--warn-soft);color:var(--warn);border:1px solid #ecd9ae}
header .sp{flex:1}
header label{font-size:12px;color:var(--sub)}
select,input[type=text],input[type=number],textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input[type=number]{width:90px}
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 49px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px}
nav h2{font-size:11px;color:var(--faint);margin:14px 8px 6px;font-weight:600}
nav button{display:flex;gap:8px;width:100%;text-align:left;padding:7px 8px;border:0;background:none;font:inherit;color:var(--ink);border-radius:4px;cursor:pointer}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button .n{color:var(--faint);font-size:12px;width:22px}
nav button .dot{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center;line-height:18px}
main{padding:22px 28px 60px;max-width:1180px}
main h2{font-size:20px;margin:0 0 2px;letter-spacing:-.3px}
.lead{color:var(--sub);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:14px;margin:0 0 10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:12px;color:var(--sub)}
.btn{font:inherit;padding:7px 14px;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--bad);border-color:#e6bcb8}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600;background:#faf9f6}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid transparent;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)} .c-info{background:var(--info-soft);color:var(--info)}
.c-mute{background:#eeede8;color:var(--sub)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fdfcfa}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.stat span{font-size:12px;color:var(--sub)}
.stat i{font-style:normal;font-size:12px;display:block;margin-top:2px}
.up{color:var(--bad)} .down{color:var(--info)} .same{color:var(--faint)}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.msg{padding:10px 12px;border-radius:4px;margin:10px 0;border:1px solid}
.msg.bad{background:var(--bad-soft);border-color:#eec4c0;color:#7c1a15}
.msg.warn{background:var(--warn-soft);border-color:#ecd9ae;color:#6d4500}
.msg.ok{background:var(--ok-soft);border-color:#bfe0cc;color:#14573a}
.msg.info{background:var(--info-soft);border-color:#c5d7ea;color:#1f4266}
.steps{display:flex;gap:6px;margin:6px 0 12px}
.steps div{flex:1;padding:7px 10px;border-radius:4px;background:#eeede8;color:var(--sub);font-size:12px}
.steps div.done{background:var(--ok-soft);color:var(--ok)} .steps div.now{background:var(--accent);color:#fff}
.steps div.fail{background:var(--bad-soft);color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.params{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.changed{background:#fff8e6}
details summary{cursor:pointer;color:var(--sub);font-size:13px;margin-top:10px}
#toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:4px;opacity:0;transition:opacity .2s;max-width:420px}
#toast.show{opacity:1}
.order{display:inline-block;width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;text-align:center;line-height:22px;font-size:12px;margin-right:6px}
@media (max-width:900px){.wrap{grid-template-columns:1fr} nav{border-right:0;border-bottom:1px solid var(--line)} .grid5,.params,.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

  <span class="sp"></span>
  <label for="role">보는 역할</label>
  <select id="role">
    <option value="all">시연용 (모든 역할)</option>
    <option value="user">현업 사용자</option>

    <option value="it">IT혁신팀</option>
    <option value="buyer">바이어 (점별 재고 신청자)</option>
  </select>
  <button class="btn" id="reset">처음 상태로</button>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

 {no:'Q-04',kind:'전일 대비 급변',to:'바이어 · 월드타워',who:'buyer',code:'2000000066',name:'가상브랜드C3 가상상품 6',detail:'월드타워 → 온라인 전환 31개. 전일 0개',q:'온라인으로 31개를 전환해도 됩니까? 매장 행사 등으로 오프라인에 남겨야 하면 이동 제외를 골라 주세요.',opts:['정상','이동 제외'],adj:{conv:-1}},

 {no:'Q-06',kind:'운영 버전과 차이',to:'프로그램 작성자',who:'author',code:'—',name:'전체',detail:'미충전 부족분 건수가 운영 버전과 다름',q:'수정한 의도와 맞는 변화입니까?',opts:['정상','로직 수정']}];

function calc(v, date, params, adj){

function startRun(o){
  const id = 'R-'+String(++S.seq).padStart(4,'0');
  const r = {id, mode:o.mode, ver:o.ver, date:o.date, params:{...o.params}, by:o.by, at:now(), status:'진행 중', stage:0,
             masters:'그룹 v'+S.masters.filter(m=>m.kind==='양수도 그룹').length*1+2+' · 제외 v'+(S.masters.filter(m=>m.kind==='제외·전용 SKU').length+4), compare:o.compare||null, hidden:o.hidden, parent:o.parent||null, applied:o.applied||null, adj:o.adj||null};
  r.masters = '그룹 v'+Math.max(...S.masters.filter(m=>m.kind==='양수도 그룹').map(m=>m.ver))+' · 제외 v'+Math.max(...S.masters.filter(m=>m.kind==='제외·전용 SKU').map(m=>m.ver));

function step(r, skipWait){
  const inp = S.inputs[r.date];
  const tick = (fn)=>setTimeout(()=>{fn();render()}, 650);
  tick(()=>{ // 입력 검증
    if(inp.partial){r.status='입력실패';r.stage=1;r.fail='재고에 없는 카테고리: COS and PFM, FOOD';r.dur='0분 21초';return}
    r.inputWarn = (r.date===TODAY)?'공헌이익 파일이 갱신 주기(35일)를 넘었습니다 (수집 10-02, 46일 경과)':null;
    if(r.mode==='운영' && r.inputWarn && !skipWait){r.status='확인대기';r.stage=1;return}
    r.stage=1;
    tick(()=>{ r.stage=2; tick(()=>{ r.stage=3;
      const res = calc(ver(r.ver), r.date, r.params, r.adj);
      r.counts=res.counts; r.rules=res.rules; r.dur = r.date==='20260812'?'6분 31초':'6분 12초';
      r.status = res.rules.some(x=>x>0)?'규칙위반':'완료'; r.stage=4;
      if(r.onDone) r.onDone(r);
    })});
  });
}

}

}

// ---------- 동작 ----------
document.addEventListener('click', async e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.page){S.page=t.dataset.page;render();return}
  if(t.id==='reset'){init();$('#role').value='all';render();toast('처음 상태로 돌렸습니다');return}
  if(t.dataset.dl){dl(t.dataset.dl, !!t.dataset.test);return}

  if(t.id==='btnRegister'){
    const f=$('#codeFile').files[0], name=$('#codeName').value.trim(), memo=$('#codeMemo').value.trim(), m=$('#regMsg');
    if(!f){m.innerHTML='<div class="msg bad">파일을 고르세요.</div>';return}
    if(f.name.includes('문법오류')){m.innerHTML='<div class="msg bad"><b>등록할 수 없습니다.</b> 문법 오류: 2번째 줄 <code>def allocate(:</code></div>';return}
    if(f.name.includes('운영본')){m.innerHTML='<div class="msg info">내용이 같은 버전이 이미 있습니다: V-001 · 운영본 v0.3. 새 버전을 만들지 않았습니다.</div>';return}
    const id='V-'+String(S.versions.length+1).padStart(3,'0');
    S.versions.push({id,name:name||f.name.replace('.py',''),memo:memo||'—',kind:f.name.includes('규칙위반')?'viol':'mod',status:'등록됨',by:'현업 사용자',at:now(),file:f.name});
    render(); $('#regMsg').innerHTML=`<div class="msg ok">${id}로 등록했습니다. S2에서 검증 실행을 할 수 있습니다.</div>`; return;
  }
  if(t.id==='btnTestRun'){
    const params={...S.prodParams}; let bad=null;
    PARAMS.forEach(p=>{const v=Number($('#p_'+p[0]).value); if(!(v>=p[3]&&v<=p[4])) bad=p; params[p[0]]=v});
    if(bad){$('#paramMsg').innerHTML=`<div class="msg bad">${bad[1]}은(는) ${bad[3]}~${bad[4]} 사이여야 합니다.</div>`;return}
    const vid=$('#tVer').value, date=$('#tDate').value, pv=prodVer();
    let cmp=null;
    if(!S.inputs[date].partial){ // 비교용: 운영 버전을 같은 입력으로 함께 실행
      cmp = S.runs.find(r=>r.ver===pv.id&&r.date===date&&r.at.startsWith('2026-11-17')&&r.counts&&JSON.stringify(r.params)===JSON.stringify(S.prodParams))
         || startRun({mode:'검증',ver:pv.id,date,params:S.prodParams,by:'시스템 (비교용)',hidden:true});
    }
    const r=startRun({mode:'검증',ver:vid,date,params,by:'현업 사용자',compare:cmp&&cmp.id});
    if(ver(vid).status==='등록됨') ver(vid).status='검증 중';
    S.viewRun=r.id; S.page='s3'; render(); return;
  }
  if(t.id==='btnPromote'){
    const r=run(t.dataset.run), v=ver(r.ver), pv=prodVer();
    const a=startRun({mode:'회귀',ver:v.id,date:'20260812',params:S.prodParams,by:'시스템 (회귀)'});
    const b=startRun({mode:'회귀',ver:pv.id,date:'20260812',params:S.prodParams,by:'시스템 (회귀)'});
    v.status='승인 대기';
    S.promos.unshift({id:'P-'+(S.promos.length+1),ver:v.id,runNew:a.id,runProd:b.id,by:'현업 사용자',at:now(),status:'승인 대기'});
    render(); toast('운영 반영을 요청했습니다. 회귀 테스트가 시작됩니다 (S4)'); return;
  }
  if(t.dataset.approve||t.dataset.reject){
    const p=S.promos.find(x=>x.id===(t.dataset.approve||t.dataset.reject)), v=ver(p.ver), op=$('#opinion_'+p.id).value.trim();
    if(t.dataset.reject&&!op){toast('반려 사유를 의견에 적어 주세요');return}
    p.decidedBy='IT혁신팀'; p.decidedAt=now(); p.opinion=op;
    if(t.dataset.approve){prodVer().status='보관'; v.status='운영'; p.status='승인됨'; toast(v.name+'이(가) 운영 버전이 되었습니다')}
    else {v.status='반려'; p.status='반려'}
    render(); return;
  }
  if(t.id==='btnMakeQ'){ S.qsets.unshift({run:t.dataset.run,state:'작성됨',ans:{}}); S.viewQ=t.dataset.run; S.page='qa'; render(); toast('이상치 '+ANOMS.length+'건으로 질문 목록을 만들었습니다'); return }
  if(t.dataset.openq){ S.viewQ=t.dataset.openq; S.page='qa'; render(); return }
  if(t.dataset.openrun){ S.viewRun=t.dataset.openrun; S.page='s3'; render(); return }
  const QS = S.qsets.find(q=>q.run===S.viewQ) || S.qsets[0];
  if(t.id==='btnQDown'){
    const rows=[QCOLS].concat(ANOMS.map(a=>{const x=QS.ans[a.no]||{};return [a.no,a.to,a.code,a.name,a.kind+' - '+a.detail,a.q+' (선택: '+a.opts.join(' / ')+')',x.choice||'',x.text||'']}));
    const el=document.createElement('a'); el.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')+'\n'],{type:'text/csv'})); el.download='질문목록_'+QS.run+'.csv'; el.click();
    toast('질문목록_'+QS.run+'.csv 내려받기. 답변 선택과 답변 내용 칸을 채워 다시 올릴 수 있습니다'); return;
  }
  if(t.id==='btnQSend'){ QS.state='보냄'; QS.sentAt=now(); render(); toast('받는 사람 5명에게 질문을 보냈습니다 (목업: 실제 발송 없음)'); return }
  if(t.id==='btnQSave'){
    let k=0; document.querySelectorAll('[data-qa-choice]').forEach(el=>{ if(el.value){ const no=el.dataset.qaChoice, a=ANOMS.find(x=>x.no===no);
      QS.ans[no]={choice:el.value,text:document.querySelector(`[data-qa-text="${no}"]`).value.trim(),by:a.to,at:now()}; k++ }});
    QS.msg = k?`<div class="msg ok">답변 ${k}건을 저장했습니다.</div>`:'<div class="msg warn">답변을 고른 항목이 없습니다.</div>'; render(); return;
  }
  if(t.id==='btnQUp'){
    const f=$('#qaFile').files[0]; if(!f){toast('답변이 적힌 질문 목록 파일을 고르세요');return}
    const lines=(await f.text()).replace(/^﻿/,'').split(/\r?\n/).filter(x=>x.length).slice(1); let ok=0; const bad=[];
    lines.forEach(l=>{const c=l.split(','), a=ANOMS.find(x=>x.no===c[0]); if(!a){bad.push(c[0]+': 없는 질문번호');return}
      if(!c[6]) return; if(!a.opts.includes(c[6])){bad.push(`${c[0]}: 답변 선택 "${c[6]}"은(는) 쓸 수 없습니다 (${a.opts.join(' / ')})`);return}
      QS.ans[a.no]={choice:c[6],text:c[7]||'',by:a.to+' (파일)',at:now()}; ok++ });
    QS.msg=`<div class="msg ${bad.length?'warn':'ok'}">${f.name}에서 답변 ${ok}건을 읽었습니다.${bad.length?'<br>읽지 못한 줄: '+bad.join(' · '):''}</div>`; render(); return;
  }
  if(t.id==='btnRetest'){
    const o=run(QS.run), plan=planOf(QS), params={...o.params}, adj={move:0,conv:0};
    plan.fix.forEach(a=>params[a.fix.key]=a.fix.val);
    plan.excl.forEach(a=>{adj.move+=(a.adj&&a.adj.move)||0; adj.conv+=(a.adj&&a.adj.conv)||0});
    const r=startRun({mode:'검증',ver:o.ver,date:o.date,params,by:'현업 사용자',compare:o.id,parent:o.id,applied:JSON.parse(JSON.stringify(QS.ans)),adj});
    QS.retest=r.id; S.viewRun=r.id; S.page='s3'; render(); toast('답변을 반영해 재테스트를 시작했습니다'); return;
  }
  if(t.dataset.rollback){ const v=ver(t.dataset.rollback); prodVer().status='보관'; v.status='운영'; render(); toast(v.name+'(으)로 되돌렸습니다'); return }
  if(t.id==='btnMaster'){
    const f=$('#mFile').files[0], kind=$('#mKind').value, m=$('#mMsg');
    if(!f){m.innerHTML='<div class="msg bad">파일을 고르세요.</div>';return}
    if(f.name.includes('시트누락')){m.innerHTML='<div class="msg bad"><b>올릴 수 없습니다.</b> 빠진 시트: 온오프전환제외상품</div>';return}
    const verNo=Math.max(...S.masters.filter(x=>x.kind===kind).map(x=>x.ver))+1;
    S.masters.push({kind,ver:verNo,file:f.name,by:'MD',at:now()}); render(); $('#mMsg').innerHTML=`<div class="msg ok">${kind} v${verNo}로 보관했습니다. 이전 버전은 그대로 남아 있습니다.</div>`; return;
  }
  if(t.id==='btnInv'){
    const f=$('#invFile').files[0], i=S.inputs[TODAY]; if(!f){toast('재고 합본 CSV를 고르세요');return}
    const text=(await f.text()).replace(/^﻿/,''); const lines=text.split(/\r?\n/).filter(x=>x.length); const head=lines[0].split(',');
    const cats=new Set(), stores=new Set(); for(let k=1;k<lines.length;k++){const c=lines[k].split(',');cats.add(c[12]);stores.add(c[2])}
    const colBad=head.length!==72?`컬럼 수가 ${head.length}개입니다 (기준 72개)`:(()=>{const x=head.findIndex((h,k)=>h!==BASE_COLS[k]);return x<0?null:`${x}번 자리의 컬럼이 "${head[x]}"입니다 (기준 "${BASE_COLS[x]}")`})();
    const mc=CATS.filter(c=>!cats.has(c)), ms=STORES.filter(s=>!stores.has(s));
    const rows=[['재고 컬럼 72개의 이름과 순서',colBad],['카테고리 6개',mc.length?'빠진 카테고리: '+mc.join(', '):null],['점 10개',ms.length?'빠진 점: '+ms.join(', '):null]];
    const fail=rows.some(r=>r[1]);
    i.files[0]=['재고 스냅샷',f.name,'올린 파일',now().slice(5),fmt(lines.length-1),fail?'bad':'ok'];
    i.state=fail?'실패':'준비됨';
    i.result=`<table style="margin-top:10px"><tr><th>재고 파일 확인 항목</th><th>결과</th><th>내용</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${chip(r[1]?'실패':'통과')}</td><td>${r[1]||'—'}</td></tr>`).join('')}</table>`+
      (fail?'<div class="msg bad"><b>이 입력으로는 실행되지 않습니다.</b> 빠진 항목을 채운 파일을 다시 올리세요.</div>':'<div class="msg ok">재고 파일이 온전합니다. 입력 묶음이 준비되었습니다.</div>');
    render(); return;
  }
  if(t.id==='btnRecollect'){toast('재수집을 요청했습니다 (목업: 기간계 접근 승인 전이라 수집되지 않습니다)');return}
  if(t.id==='btnProdRun'){ startRun({mode:'운영',ver:prodVer().id,date:TODAY,params:S.prodParams,by:'S&OP 담당자'}); render(); return }
  if(t.id==='btnContinue'){ const r=run(t.dataset.run); r.status='진행 중'; r.continued=true; step(r,true); S.page='s7'; render(); return }
  if(t.id==='btnApprove'){ const r=run(t.dataset.run); r.status='승인됨'; r.approvedBy='S&OP 담당자'; r.approvedAt=now(); render(); toast('승인했습니다. S8에서 ERP 업로드 파일을 내려받을 수 있습니다'); return }
});
document.addEventListener('change', e=>{
  if(e.target.id==='role'){S.role=e.target.value;render()}
  if(e.target.id==='pickRun'){S.viewRun=e.target.value;render()}
  if(e.target.id&&e.target.id.startsWith('p_')){const p=PARAMS.find(x=>'p_'+x[0]===e.target.id); e.target.classList.toggle('changed', Number(e.target.value)!==S.prodParams[p[0]])}
});
init(); render();
</script>
</body>
</html>
